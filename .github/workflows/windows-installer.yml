
name: Build Windows Installer

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Get launcher files
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

     
      - name: Build Windows installer
        run: npm run build:windows -- --publish never


      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Cryptic-Verse-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error
